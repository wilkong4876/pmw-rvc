name: Build PMW GPU image
on:
  workflow_dispatch:
  push:
    paths:
      - 'gpu/Dockerfile'
      - 'gpu/setup.sh'
      - 'gpu/check_image.py'
      - '.dockerignore'
      - '.github/workflows/build-gpu-image.yml'
permissions:
  contents: read
  packages: write
concurrency:
  group: pmw-gpu-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check build inputs
        run: |
          bash -n gpu/setup.sh
          python3 -m py_compile gpu/check_image.py
      - name: Free space on disposable GitHub runner
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /
      - name: Select image name
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pmw-rvc"
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, verify and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gpu/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:cu128-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
      - name: Record exact published image
        env:
          PMW_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          printf '%s\n' "$PMW_IMAGE" > pmw-image.txt
          printf '### PMW image built\n\n`%s`\n\nGPU testing and package pull access must pass before enabling PMW_GPU_IMAGE.\n' "$PMW_IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pmw-image-reference
          path: pmw-image.txt
